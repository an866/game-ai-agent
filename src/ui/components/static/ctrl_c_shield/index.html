<!DOCTYPE html>
<html>
  <body>
    <!-- Ctrl+C 拦截盾
         Streamlit ReactHotkeys 把裸键 'c' 绑到 Clear cache，焦点不在输入框时
         Ctrl+C 复制也会弹窗。iframe 跨域时 window.parent.document 不可写，
         故多层兜底：parent / top / 同源 window 均尝试；capture + stopImmediatePropagation。 -->
    <script>
      (function () {
        function announceReady() {
          try {
            window.parent.postMessage(
              { type: "streamlit:setComponentReady", apiVersion: 1 },
              "*"
            );
          } catch (e) {}
        }
        announceReady();
        window.addEventListener("load", announceReady);

        function isCopyShortcut(e) {
          if (!(e.ctrlKey || e.metaKey)) return false;
          if (e.altKey) return false;
          var k = (e.key || "").toLowerCase();
          // c = 复制；x = 剪切（同样可能被裸键快捷键误伤）
          return k === "c" || k === "x";
        }

        function onKey(e) {
          if (!isCopyShortcut(e)) return;
          // 阻断 Streamlit hotkeys；保留系统剪贴板（勿调 preventDefault）
          e.stopImmediatePropagation();
        }

        function bind(doc) {
          if (!doc || doc.__ctrlCShieldBound) return false;
          try {
            doc.addEventListener("keydown", onKey, true);
            doc.addEventListener("keypress", onKey, true);
            doc.__ctrlCShieldBound = true;
            return true;
          } catch (e) {
            return false;
          }
        }

        function tryBind() {
          var ok = false;
          try {
            if (bind(window.parent.document)) ok = true;
          } catch (e) {}
          try {
            if (window.top && window.top !== window.parent) {
              if (bind(window.top.document)) ok = true;
            }
          } catch (e) {}
          if (ok) {
            try { window.parent.__shieldActive = true; } catch (e) {}
          }
          return ok;
        }

        // 首载 + 延迟重试（组件 iframe 可能晚于 Streamlit 主文档）
        if (!tryBind()) {
          var n = 0;
          var t = setInterval(function () {
            n++;
            if (tryBind() || n > 20) clearInterval(t);
          }, 250);
        }
      })();
    </script>
  </body>
</html>
